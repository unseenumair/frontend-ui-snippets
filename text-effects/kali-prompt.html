<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Kali Linux Prompt</title>
	<link rel="icon" href="https://cdn.jsdelivr.net/gh/unseenumair/assets/icons/css.svg">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cousine:ital,wght@0,400;0,700;1,400;1,700&display=swap">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html,
		body {
			width: 100%;
			height: 100%;
			padding: 7px 10px;
			overflow: hidden;
			background: #101010;
		}
		#prompt {
			font-size: 1.1rem;
			font-family: "Cousine", monospace;
			font-weight: bold;
			color: red;
		}
		#prompt .brackets { color: skyblue; }
	</style>
</head>
<body>
	<div id="prompt">
		<span class="brackets">┌──(</span>umair㉿root<span class="brackets">)-[</span><span style="color: var(--textCol);">~</span><span class="brackets">]<br>
		└─</span> #
	</div>
</body>
</html>
