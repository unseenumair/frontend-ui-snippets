<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Water Text Effect</title>
	<link rel="icon" href="https://cdn.jsdelivr.net/gh/unseenumair/assets/icons/css.svg">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Madimi+One&display=swap">
	<style>
		:root {
			--waterCol: #30a9f4;
		}
		
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			font-family: "Madimi One", sans-serif; 
			background: black;
			display: grid;
			place-items: center;
		}

		#text {
			position: relative;
			font-size: 8rem;
		}

		h2 {
			position: absolute;
			top: 0;
			left: 0;
			transform: translate(-50%, -50%);
		}
		
		h2:nth-child(1) {
			z-index: 0;
			color: transparent;
			-webkit-text-stroke: 1px var(--waterCol);
		}

		h2:nth-child(2) {
			z-index: 1;
			color: #30a9f4;
			animation: water 4s ease-in-out infinite;
		}
		
		@keyframes water {
			0%,
			100% {
				clip-path: polygon(0 45%, 15% 44%, 32% 50%, 54% 60%, 70% 61%, 84% 59%, 100% 52%, 100% 100%, 0 100%);
			}
			50% {
				clip-path: polygon(0 60%, 16% 65%, 34% 66%, 51% 62%, 67% 50%, 84% 45%, 100% 46%, 100% 100%, 0 100%);
			}
		}
		
	</style>
</head>
<body>
	<div id="text">
	<h2>Water</h2>
	<h2>Water</h2>
	</div>
</body>
</html>
