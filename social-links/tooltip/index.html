<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Show ToolTip</title>
	<!-- CDN -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
	<!-- Font -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500&display=swap">
	<!-- CSS -->
	<link rel="stylesheet" href="styles.css">
	<!-- Fav -->
	<link rel="icon" href="https://cdn.jsdelivr.net/gh/unseenumair/assets/icons/css.svg">
	<base target="_blank">
</head>
<body>
	<section>
			<div class="link">
				<span class="tooltip"><mark>Github</mark></span>
				<a href="https://www.github.com/unseenumair" rel="noopener noreferrer"><i class="fa-brands fa-github"></i></a>
			</div>
            <div class="link">
                <span class="tooltip"><mark>Linkedin</mark></span>
                <a href="https://www.linkedin.com/in/unseenumair" rel="noopener noreferrer"><i class="fa-brands fa-linkedin-in"></i></a>
            </div>
            <div class="link">
                <span class="tooltip"><mark>Twitter</mark></span>
                <a href="https://www.x.com/unseenumair" rel="noopener noreferrer"><i class="fa-brands fa-x-twitter"></i></a>
            </div>
            <div class="link">
                <span class="tooltip"><mark>Dev.to</mark></span>
                <a href="https://www.dev.to/unseenumair" rel="noopener noreferrer"><i class="fa-brands fa-dev"></i></a>
            </div>
            <div class="link">
                <span class="tooltip"><mark>Youtube</mark></span>
                <a href="https://www.youtube.com/unseenumair" rel="noopener noreferrer"><i class="fa-brands fa-youtube"></i></a>
            </div>
	</section>
	
	<!-- ToolTip SVG ClipPath -->
	<svg width="0" height="0" xmlns="http://www.w3.org/2000/svg">
	  <clipPath id="tip-icon" clipPathUnits="objectBoundingBox">
	    <path d="M0.843764 0 C0.930049 0 1 0.164163 1 0.366667 C1 0.569171 0.930049 0.733333 0.843764 0.733333 H0.62751 L0.628296 0.735434 L0.500004 0.999317 L0.400799 0.733674 L0.400964 0.733333 H0.156236 C0.069949 0.733333 0 0.569171 0 0.366667 C0 0.164163 0.069949 0 0.156236 0 H0.843764 Z "/>
	  </clipPath>
	</svg>
</body>
</html>
