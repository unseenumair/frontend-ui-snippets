<!DOCTYPE html>
<html lang="en>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap">
	<title>Blinking Cursor</title>
	<style>
		:root{
			--bodyBg: black;
			--textCol: white;
			--cursorBg: red;
		}
		
		*{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		
		html,
		body{
			width: 100%;
			height: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
			background: var(--bodyBg);
			color: var(--textCol);
			font-family: "Funnel Display", sans-serif;
		}
		
		p{
			width: 100%;
			text-align: center;
			font-weight: medium;
			font-size: clamp(30px, 5rem, 50px);
		}

		#blinking-cursor{
			display: inline-block;
			width: 1px;
			height: clamp(50px, 8vmin, 70px);
			background: var(--cursorBg);
			margin-left: 7px;
			transform: translateY(9px);
			animation: blink 0.6s step-end 0s infinite;
		}

		@keyframes blink{
			0%,
			100%{
				opacity: 1;
			}
			50%{
				opacity: 0;
			}
		}
	</style>
</head>
<body>
	<p>Cursor<span id="blinking-cursor"></span></p>
</body>
</html>
