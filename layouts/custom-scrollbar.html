<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Scroll Bar</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/unseenumair/assets/icons/css.svg" type="svg+xml">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html,
    body {
      width: 100%;
      height: 200%;
      overflow: auto;
      background: black;
      color: white;
      user-select: none;
    }
    
    h1 {
     text-align: center;
      width: 100%;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    
    /* Custom Scroll Bar */
    ::-webkit-scrollbar {
      width: 1rem;
    }
    
    ::-webkit-scrollbar-track {
      background: #f9f9f9;
    }
    
    ::-webkit-scrollbar-thumb {
      background: royalblue;
      border-radius: 2rem;
      border: 1px solid white;
      background-clip: content-box;
      -webkit-background-clip: content-box;
    }

    ::-webkit-scrollbar-thumb:hover {
    	background: black;
    }
  </style>
</head>
<body>
  <h1>Custom Scroll Bar</h1>
</body>
</html>
