<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Iframe BG</title>
	<style>
		#bg{
			position: fixed;
			top: 0;
			left: 0;
			z-index: -1;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			pointer-events: none;
		}
		#bg iframe{
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			pointer-events: none;
			width: 120vw; /* Slightly OverSized to hide black borders */
			height: 120vh;
		}
	</style>
</head>
<body>
	<div id="bg">
		<iframe 
		src="https://www.youtube.com/embed/I-RNcfKjlKw?autoplay=1&mute=1&loop=1&playlist=I-RNcfKjlKw&controls=0&showinfo=0&modestbranding=1"
			frameborder="0"
			allow="autoplay; fullscreen; encrypted-media"
			allowfullscreen
		></iframe>
	</div>
</body>
</html>
